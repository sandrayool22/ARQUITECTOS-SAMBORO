
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Registro de clientes | Samboro</title>

    <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">
</head>

<body>

<section class="section">
    <div class="container">

        <div class="has-text-centered mb-5">
            <h1 class="title is-2 has-text-danger">
                SAMBORO
            </h1>

            <h2 class="subtitle">
                Registro de visitantes
            </h2>

            <p>¡Bienvenido! Queremos brindarte una mejor atención.</p>
        </div>

        <div class="columns is-centered">
            <div class="column is-6">

                <div class="box">

                    <form id="formulario">

                        <div class="field">
                            <label class="label">Nombre</label>
                            <div class="control">
                                <input class="input"
                                type="text"
                                name="nombre"
                                placeholder="Ingresa tu nombre">
                            </div>
                        </div>

                        <div class="field">
                            <label class="label">Número de teléfono</label>
                            <div class="control">
                                <input class="input"
                                type="tel"
                                name="telefono"
                                placeholder="Ej. 55555555"
                                pattern="[0-9+() -]{8,20}"
                                required>
                            </div>
                        </div>

                        <div class="field">
                            <label class="label">Tienda que visitas</label>
                            <div class="control">
                                <div class="select is-fullwidth">
                                    <select name="tienda" required>
                                        <option value="">Selecciona una tienda</option>
                                        <option>San Cristóbal</option>
                                        <option>Centro Logístico</option>
                                        <option>Zona 7</option>
                                        <option>Zona 9</option>
                                        <option>Zona 11</option>
                                        <option>Zona 17</option>
                                        <option>Villa Nueva</option>
                                        <option>Decocity</option>
                                        <option>Viterra</option>
                                        <option>Zona 7 Outlet</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <div class="field">
                            <label class="label">Motivo de visita</label>
                            <div class="control">
                                <div class="select is-fullwidth">
                                    <select name="motivo" required>
                                        <option value="">Selecciona una opción</option>
                                        <option>Compra</option>
                                        <option>Cotización</option>
                                        <option>Consulta de productos</option>
                                        <option>Reclamo</option>
                                        <option>Otro</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <div class="field">
                            <label class="label">Producto de interés</label>
                            <div class="control">
                                <input class="input"
                                type="text"
                                name="producto"
                                placeholder="Ej. Pisos, baños, fachaletas...">
                            </div>
                        </div>

                        <div class="field">
                            <label class="checkbox">
                                <input type="checkbox"
                                name="consentimiento"
                                value="si"
                                required>
                                Autorizo a Samboro a utilizar mis datos
                                para seguimiento comercial, conforme al
                                aviso de privacidad.
                            </label>
                        </div>

                        <div class="field mt-5">
                            <button class="button is-danger is-fullwidth"
                            type="submit"
                            id="btnEnviar">
                                Aceptar y registrarme
                            </button>
                        </div>

                    </form>

                    <div id="mensaje" class="notification is-hidden mt-4"></div>

                </div>
            </div>
        </div>

    </div>
</section>

<script>

const URL_SCRIPT = "https://script.google.com/macros/s/AKfycbxN6Fqo__uUZkf3yjCbnOZ7wOYoLg5GrZ2WmS3aG1mcAFz22Zc56TOVgUNbbEVFJEnwTg/exec";

const formulario = document.getElementById("formulario");
const boton = document.getElementById("btnEnviar");
const mensaje = document.getElementById("mensaje");

formulario.addEventListener("submit", async function(e) {

    e.preventDefault();

    boton.classList.add("is-loading");
    boton.disabled = true;

    const datos = new URLSearchParams(
        new FormData(formulario)
    );

    try {

        await fetch(URL_SCRIPT, {
            method: "POST",
            body: datos,
            mode: "no-cors"
        });

        mensaje.className = "notification is-success mt-4";
        mensaje.textContent =
            "¡Gracias! Tu registro ha sido enviado.";

        formulario.reset();

    } catch (error) {

        mensaje.className = "notification is-danger mt-4";
        mensaje.textContent =
            "No se pudo enviar el registro. Intenta nuevamente.";

    } finally {

        boton.classList.remove("is-loading");
        boton.disabled = false;

    }

});

</script>

</body>
</html>
